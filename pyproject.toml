[project]
name = "estwordgen"
version = "1.5.0"
description = "Estonian pseudoword generator using character n-gram Markov chains"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Lauri Vihman" }]
dependencies = []

[project.scripts]
estwordgen = "estwordgen.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # tests run from a checkout without installing the package

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
