# Tests on every push and PR. A v* tag on a master commit also builds the package
# and publishes it as a GitHub Release; nothing is packaged before the merge and tag.
# The tag must match pyproject's version: v1.5.0 <-> version = "1.5.0".
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e . pytest ruff

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, to check the tag is on master

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the tag is on master and matches the package version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }

      - name: Build
        run: pip install build && python -m build

      - name: Publish GitHub Release
        run: |  # a release made in the web UI already exists: just attach the files
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
